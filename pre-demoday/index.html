<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-TECH PIONEERS PRE-DEMO DAY · Pitch Timer</title>
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/panchang.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* 폰트는 전부 로컬 — 행사장 인터넷이 끊겨도 그대로 나온다 */
  @font-face { font-family: "Unbounded"; src: url(fonts/unbounded.woff2) format("woff2"); font-weight: 200 900; font-display: block; }
  @font-face { font-family: "Panchang"; src: url(fonts/panchang.woff2) format("woff2"); font-weight: 700; font-display: block; }

  /* 색은 RSVP pre-demoday 키비주얼(styles.css)과 같은 값 */
  :root {
    --ink: #f4f5ff;
    --ink-2: rgba(232, 234, 255, 0.72);
    --ink-3: rgba(232, 234, 255, 0.46);
    --line: rgba(140, 150, 255, 0.18);
    --line-2: rgba(140, 150, 255, 0.32);
    --violet-2: #6b5cff;
    --blue: #3d7bff;
    --pink: #ff7ab8;
    --danger: #ff6b8a;
    --accent: var(--violet-2);
    --ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: dark;
  }
  body[data-phase="qna"] { --accent: var(--blue); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--ink);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body.idle-cursor { cursor: none; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* 키비주얼의 지평선(아래쪽 빛나는 호) */
  .horizon {
    position: fixed;
    left: 50%; bottom: -66vw;
    width: 150vw; height: 80vw;
    translate: -50% 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(10, 6, 30, 1) 92%, transparent 100%);
    box-shadow: 0 -30px 120px -20px rgba(140, 70, 220, 0.45), inset 0 30px 60px -30px rgba(170, 90, 255, 0.5);
    transition: box-shadow 1.2s var(--ease);
  }
  body[data-phase="qna"] .horizon { box-shadow: 0 -30px 120px -20px rgba(60, 110, 255, 0.45), inset 0 30px 60px -30px rgba(90, 140, 255, 0.5); }
  body[data-state="final"] .horizon,
  body[data-state="done"] .horizon { box-shadow: 0 -30px 140px -20px rgba(255, 90, 140, 0.5), inset 0 30px 60px -30px rgba(255, 110, 170, 0.55); }

  /* 마지막 1분: 화면 뒤에서 천천히 숨 쉬는 핑크 글로우 (1초에 1번 — 깜빡임 기준 3회/초 훨씬 아래) */
  .pulse {
    position: fixed; left: 50%; top: 50%;
    width: 120vmax; height: 120vmax;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 107, 138, 0.22) 0%, rgba(255, 107, 138, 0.06) 24%, transparent 50%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
  }
  body[data-state="final"] .pulse { opacity: 0.6; }
  @media (prefers-reduced-motion: no-preference) {
    body[data-state="final"] .pulse { animation: breathe 1s ease-in-out infinite; }
    body[data-state="final"][data-last10="true"] .pulse { animation-duration: 0.5s; }
  }
  @keyframes breathe { 0%, 100% { opacity: 0.3; } 18% { opacity: 1; } 40% { opacity: 0.45; } }
  body[data-paused="true"] .pulse { animation-play-state: paused; }

  /* 1920×1080 무대를 화면에 맞게 스케일 (프로젝터 16:9 기준) */
  .stage {
    position: fixed;
    left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  .brand {
    position: absolute; left: 0; right: 0; top: 86px;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .brand img { width: 470px; height: auto; display: block; filter: drop-shadow(0 0 30px rgba(110, 90, 255, 0.35)); }
  .brand .event {
    font: 700 30px/1 "Panchang", sans-serif;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, #ece8ff 0%, #b3a6ff 50%, #7c69ff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* 소제목 — 키비주얼의 양옆 선 달린 라벨 */
  .phase-label {
    position: absolute; left: 0; right: 0; top: 318px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font: 500 30px/1 "Unbounded", sans-serif;
    letter-spacing: 0.3em;
    color: var(--accent);
    transition: color 0.6s;
  }
  .phase-label::before, .phase-label::after {
    content: ''; width: 72px; height: 2px;
    background: linear-gradient(90deg, transparent, currentColor);
  }
  .phase-label::after { transform: scaleX(-1); }
  body[data-state="final"] .phase-label { color: var(--danger); }

  .time {
    position: absolute; left: 0; right: 0; top: 380px;
    display: flex; justify-content: center;
    font: 600 288px/1 "Unbounded", sans-serif;
    color: #fff;
    text-shadow: 0 0 60px rgba(120, 100, 255, 0.45);
    transition: color 0.4s, text-shadow 0.6s, opacity 0.4s;
  }
  /* 숫자마다 칸 너비를 고정해서 초가 바뀔 때 글자가 좌우로 흔들리지 않게 */
  /* 숫자 뒤 어두운 바탕 — 오브 선이 숫자와 겹쳐도 읽히게 */
  .time::before {
    content: ''; position: absolute; left: 50%; top: 50%; z-index: -1;
    width: 1500px; height: 420px; translate: -50% -50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.45) 60%, transparent);
    opacity: 0; transition: opacity 1.2s var(--ease);
  }
  body[data-state="running"] .time::before,
  body[data-state="final"] .time::before { opacity: 1; }
  .time span { display: inline-block; width: 0.84em; text-align: center; }
  .time span.colon { width: 0.42em; translate: 0 -0.06em; }
  body[data-phase="qna"] .time { text-shadow: 0 0 60px rgba(70, 120, 255, 0.45); }
  body[data-state="final"] .time { color: var(--danger); text-shadow: 0 0 70px rgba(255, 107, 138, 0.6); }
  @media (prefers-reduced-motion: no-preference) {
    body[data-state="final"] .time { animation: beat 1s ease-in-out infinite; }
    body[data-state="final"][data-last10="true"] .time { animation-duration: 0.5s; }
  }
  @keyframes beat { 0%, 100% { scale: 1; } 14% { scale: 1.04; } 30% { scale: 1; } 44% { scale: 1.02; } }
  body[data-paused="true"] .time { animation: none; opacity: 0.45; }

  .status {
    position: absolute; left: 0; right: 0; top: 724px;
    text-align: center;
    font: 500 24px/1 "Unbounded", sans-serif;
    letter-spacing: 0.24em;
    color: var(--ink-3);
    transition: color 0.4s, opacity 0.4s;
  }
  body[data-state="final"] .status { color: var(--danger); }

  /* 종료 화면 */
  .timesup {
    position: absolute; left: 0; right: 0; top: 420px;
    text-align: center;
    font: 700 196px/1 "Panchang", sans-serif;
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, #fff 0%, #ffc6e4 45%, #ff7ab8 75%, #8a6bff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 40px rgba(255, 122, 184, 0.45));
    opacity: 0;
  }
  .next {
    position: absolute; left: 0; right: 0; top: 700px;
    text-align: center;
    font: 500 26px/1.4 "Unbounded", sans-serif;
    letter-spacing: 0.2em;
    color: var(--ink-2);
    opacity: 0;
  }
  .next kbd {
    display: inline-block; padding: 6px 16px; margin: 0 6px;
    border: 1px solid var(--line-2); border-radius: 999px;
    font: inherit; font-size: 20px; letter-spacing: 0.16em; color: #fff;
    background: rgba(255, 255, 255, 0.04);
  }
  body[data-state="done"] .time,
  body[data-state="done"] .status { opacity: 0; }
  body[data-state="done"] .timesup { opacity: 1; transition: opacity 0.5s; }
  body[data-state="done"] .next { opacity: 1; transition: opacity 0.6s 0.6s; }
  @media (prefers-reduced-motion: no-preference) {
    body[data-state="done"] .timesup { animation: arrive 1.1s var(--ease) both; }
    body[data-state="done"] .next { animation: rise 0.8s var(--ease) 0.6s both; }
  }
  /* 키비주얼 인트로처럼 자간이 넓게 흩어졌다가 모이며 등장 */
  @keyframes arrive {
    from { letter-spacing: 0.35em; filter: blur(14px) drop-shadow(0 0 40px rgba(255, 122, 184, 0.45)); opacity: 0; }
    to { letter-spacing: 0.01em; filter: blur(0) drop-shadow(0 0 40px rgba(255, 122, 184, 0.45)); opacity: 1; }
  }
  @keyframes rise { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }

  /* 진행 트랙: 피칭 7 : Q&A 5 비율 */
  .track {
    position: absolute; left: 50%; top: 880px;
    width: 1180px; translate: -50% 0;
    display: flex; gap: 20px;
  }
  .seg { display: flex; flex-direction: column; gap: 16px; opacity: 0.4; transition: opacity 0.6s; }
  .seg[data-key="pitch"] { flex: 7; }
  .seg[data-key="qna"] { flex: 5; }
  .seg.is-active, .seg.is-done { opacity: 1; }
  .seg__head {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 500 19px/1 "Unbounded", sans-serif; letter-spacing: 0.2em;
    color: var(--ink-2);
  }
  .seg__head b { font-weight: 600; color: #fff; }
  .seg__head i { font-style: normal; color: var(--ink-3); letter-spacing: 0.08em; }
  .seg__bar { position: relative; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .seg__bar span {
    position: absolute; inset: 0;
    transform-origin: left; scale: var(--p, 0) 1;
    border-radius: inherit;
    background: linear-gradient(90deg, #3a2fd0, #6b5cff 55%, #ff7ab8);
    box-shadow: 0 0 18px rgba(120, 100, 255, 0.8);
  }
  .seg[data-key="qna"] .seg__bar span { background: linear-gradient(90deg, #2349d6, #3d7bff 55%, #9fc0ff); box-shadow: 0 0 18px rgba(61, 123, 255, 0.8); }
  body[data-state="final"] .seg.is-active .seg__bar span { background: linear-gradient(90deg, #ff4f7a, #ff7ab8); box-shadow: 0 0 18px rgba(255, 107, 138, 0.9); }

  /* 종료 순간 한 번만 퍼지는 빛 */
  .flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 240, 250, 0.85) 0%, rgba(255, 122, 184, 0.45) 28%, rgba(107, 92, 255, 0.2) 55%, transparent 80%);
  }
  .flash.on { animation: fade 1.4s ease-out; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }

  /* 단축키 안내 — 마우스를 움직이면 3초간 보임 */
  .help {
    position: fixed; left: 50%; bottom: 18px;
    translate: -50% 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
    max-width: calc(100% - 32px);
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(10, 8, 28, 0.6);
    backdrop-filter: blur(8px);
    font: 500 13px/1.4 var(--ui);
    color: var(--ink-2);
    transition: opacity 0.6s;
  }
  .help kbd {
    display: inline-block; min-width: 22px;
    padding: 1px 6px; margin-right: 4px;
    border: 1px solid var(--line-2); border-radius: 5px;
    font: inherit; text-align: center; color: #fff;
  }
  .help.hidden { opacity: 0; pointer-events: none; }
  .toast {
    position: fixed; right: 20px; top: 20px;
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(10, 8, 28, 0.7);
    font: 600 14px/1.4 var(--ui);
    opacity: 0; transition: opacity 0.3s;
  }
  .toast.on { opacity: 1; }
  @media (max-width: 640px) { .help { display: none; } }
</style>
</head>
<body data-phase="pitch" data-state="ready" data-paused="false">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="orb" aria-hidden="true"></canvas>
  <div class="horizon" aria-hidden="true"></div>
  <div class="pulse" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="brand">
      <img src="assets/ktp-logo.svg" alt="K-TECH PIONEERS" />
      <span class="event">PRE-DEMO DAY</span>
    </div>

    <div class="phase-label" id="phaseLabel">IR PITCH</div>
    <div class="time" id="time" role="timer" aria-live="off"></div>
    <div class="status" id="status">PRESS SPACE TO START</div>

    <div class="timesup" aria-hidden="true">TIME’S UP</div>
    <div class="next" id="next"></div>

    <div class="track" aria-hidden="true">
      <div class="seg" data-key="pitch">
        <div class="seg__head"><span><b>01</b>&nbsp; IR PITCH</span><i data-dur></i></div>
        <div class="seg__bar"><span></span></div>
      </div>
      <div class="seg" data-key="qna">
        <div class="seg__head"><span><b>02</b>&nbsp; Q&amp;A</span><i data-dur></i></div>
        <div class="seg__bar"><span></span></div>
      </div>
    </div>
  </main>

  <div class="help" id="help">
    <span><kbd>Space</kbd>시작/일시정지</span>
    <span><kbd>N</kbd><kbd>P</kbd>다음/이전 단계</span>
    <span><kbd>R</kbd>이 단계 리셋</span>
    <span><kbd>0</kbd>처음으로(다음 팀)</span>
    <span><kbd>↑</kbd><kbd>↓</kbd>±1분 (<kbd>Shift</kbd> ±10초)</span>
    <span><kbd>T</kbd>10초 전으로</span>
    <span><kbd>F</kbd>전체화면</span>
    <span><kbd>M</kbd>음소거</span>
  </div>
  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---------- 설정: 피칭 7분 → Q&A 5분 ----------
  const PHASES = [
    { key: "pitch", label: "IR PITCH", sec: 7 * 60 },
    { key: "qna",   label: "Q&A",      sec: 5 * 60 },
  ];
  const FINAL_SEC = 60;
  const MAX_SEC = 99 * 60 + 59;

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const timeEl = $("time"), statusEl = $("status"), labelEl = $("phaseLabel"), nextEl = $("next");
  const helpEl = $("help"), toastEl = $("toast"), flashEl = $("flash");
  const segs = [...document.querySelectorAll(".seg")];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DPR = Math.min(devicePixelRatio || 1, 2);

  // 시간 글자 칸 (MM:SS) — 칸 너비 고정
  const cells = "00:00".split("").map((c) => {
    const s = document.createElement("span");
    if (c === ":") { s.className = "colon"; s.textContent = ":"; }
    timeEl.appendChild(s);
    return s;
  });

  let phase = 0;
  let durations = PHASES.map((p) => p.sec * 1000);   // 단계별 설정 시간 (↑↓로 바꿀 수 있음)
  let remaining = durations[0];
  let endAt = 0;
  let running = false, done = false, muted = false;

  // ---------- 화면 스케일 ----------
  function fit() {
    $("stage").style.setProperty("--scale", Math.min(innerWidth / 1920, innerHeight / 1080));
  }
  addEventListener("resize", fit);
  fit();

  // ---------- 렌더 ----------
  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  }

  function render() {
    const p = PHASES[phase];
    const secs = Math.ceil(remaining / 1000);
    const started = running || remaining < durations[phase];
    let state = "ready";
    if (done) state = "done";
    else if (started) state = secs <= FINAL_SEC ? "final" : "running";

    body.dataset.phase = p.key;
    body.dataset.state = state;
    body.dataset.paused = String(!running && !done && started);
    body.dataset.last10 = String(!done && started && secs <= 10);
    labelEl.textContent = p.label;

    const t = fmt(remaining);
    t.split("").forEach((c, i) => { if (cells[i].textContent !== c) cells[i].textContent = c; });

    if (state === "ready") statusEl.textContent = "PRESS SPACE TO START";
    else if (!running) statusEl.textContent = "PAUSED";
    else if (state === "final") statusEl.textContent = secs <= 10 ? "WRAP UP NOW" : "FINAL 1 MIN";
    else statusEl.textContent = "";

    nextEl.innerHTML = phase < PHASES.length - 1
      ? `<kbd>SPACE</kbd> START ${PHASES[phase + 1].label} · ${fmt(durations[phase + 1])}`
      : `THANK YOU &nbsp;·&nbsp; <kbd>SPACE</kbd> NEXT TEAM`;

    segs.forEach((el, i) => {
      el.classList.toggle("is-active", i === phase);
      el.classList.toggle("is-done", i < phase);
      const prog = i < phase ? 1 : i > phase ? 0 : 1 - remaining / durations[i];
      el.querySelector(".seg__bar span").style.setProperty("--p", prog.toFixed(4));
      el.querySelector("[data-dur]").textContent = fmt(durations[i]);
    });

    document.title = done ? "TIME'S UP · Pitch Timer" : `${t} ${p.label} · Pitch Timer`;
  }

  // ---------- 제어 ----------
  function start() {
    if (done || remaining <= 0) return;
    ensureAudio();
    running = true;
    endAt = performance.now() + remaining;
    keepAwake();
    render();
  }

  function pause() {
    running = false;
    remaining = Math.max(0, endAt - performance.now());
    render();
  }

  function goPhase(i, autostart = false) {
    phase = (i + PHASES.length) % PHASES.length;
    running = false; done = false;
    remaining = durations[phase];
    stopSound();
    orb.collapse = 0;
    render();
    if (autostart) start();
  }

  function finish() {
    running = false; done = true; remaining = 0;
    render();
    orb.shootNow = true;
    if (!reduced) {
      flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on");
    }
    playTimesUp();
  }

  function adjust(deltaSec) {
    if (done) return;
    const delta = deltaSec * 1000;
    const idle = !running && remaining === durations[phase];
    if (idle) {
      // 시작 전: 이 단계의 설정 시간 자체를 바꿈 (최소 10초)
      durations[phase] = clamp(durations[phase] + delta, 10000, MAX_SEC * 1000);
      remaining = durations[phase];
    } else {
      // 진행/일시정지 중: 남은 시간만 조정
      const now = performance.now();
      const next = clamp((running ? endAt - now : remaining) + delta, 0, MAX_SEC * 1000);
      if (running) { endAt = now + next; remaining = next; if (next <= 0) return finish(); }
      else remaining = Math.max(next, 1000);
    }
    render();
    toast((deltaSec > 0 ? "+" : "−") + (Math.abs(deltaSec) >= 60 ? Math.abs(deltaSec) / 60 + "분" : Math.abs(deltaSec) + "초"));
  }

  // T: 남은 시간을 10초로 (리허설·사운드 체크용)
  function jumpTo(sec) {
    if (done) return;
    remaining = sec * 1000;
    if (running) endAt = performance.now() + remaining;
    render();
    toast(sec + "초 전으로 이동");
  }

  // Space: 진행 중이면 일시정지, 끝났으면 다음 단계로 넘어가며 바로 시작
  function primary() {
    if (done) {
      if (phase < PHASES.length - 1) goPhase(phase + 1, true);
      else goPhase(0);
      return;
    }
    running ? pause() : start();
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 900);
  }

  // 발표 중 노트북 화면이 꺼지지 않게 (지원 브라우저에서만)
  let wakeLock = null;
  async function keepAwake() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

  // ---------- 배경: 별 ----------
  function createStars(canvas) {
    const ctx = canvas.getContext("2d");
    let w, h, stars = [];
    function resize() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * DPR; canvas.height = h * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      stars = Array.from({ length: Math.round((w * h) / 9000) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 0.9 + 0.2, p: Math.random() * Math.PI * 2,
      }));
    }
    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        ctx.fillStyle = `rgba(200,205,255,${0.25 + 0.35 * Math.sin(t / 1400 + s.p)})`;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
    }
    resize();
    addEventListener("resize", resize);
    return { frame };
  }

  // ---------- 배경: 키비주얼 오브 ----------
  // RSVP 키비주얼과 같은 그림(같은 장축을 공유하는 경선 + 장축의 빛줄기).
  // 타이머에서는 남은 시간만큼 구가 열려 있다가, 시간이 줄수록 납작해져 한 줄의 빛으로 모인다.
  // 색: 피칭 = 보라, Q&A = 파랑, 마지막 1분 = 핑크
  const PALETTES = {
    pitch: { base: [86, 72, 230], near: [120, 40, 0], ring: [90, 76, 230] },
    qna:   { base: [60, 110, 255], near: [100, 90, 0], ring: [61, 123, 255] },
    final: { base: [230, 80, 150], near: [25, 110, 60], ring: [255, 107, 138] },
  };
  function createOrb(canvas) {
    const ctx = canvas.getContext("2d");
    const N = 26, SHOT_MS = 950;
    const api = { open: 1, heat: 0, qna: 0, collapse: 0, dim: 1, shootNow: false };
    let w = 0, h = 0, shotStart = -1e9, nextShot = 4000;
    const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

    function resize() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * DPR; canvas.height = h * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.53;
      const R = Math.min(w * 0.34, h * 0.42);
      const time = reduced ? 0 : t / 1000;
      const cool = (k) => mix(PALETTES.pitch[k], PALETTES.qna[k], api.qna);
      const pal = (k) => mix(cool(k), PALETTES.final[k], api.heat);
      const base = pal("base"), near2 = pal("near"), ring = pal("ring");
      const open = Math.max(0.04, api.open) * (1 - api.collapse);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.52);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.85 * api.dim;

      for (let i = 0; i < N; i++) {
        const u = (i / N + time * 0.018) % 1;
        const ry = R * Math.pow(u, 1.4) * open;
        const fade = Math.min(1, u / 0.08) * (1 - Math.max(0, (u - 0.88) / 0.12));
        const n = (1 - u) * (1 - u);
        ctx.beginPath();
        ctx.ellipse(0, 0, R, Math.max(ry, 0.3), 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${base[0] + near2[0] * n}, ${base[1] + near2[1] * n}, ${base[2] + near2[2] * n}, ${(0.18 + 0.32 * (1 - u)) * fade})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.ellipse(0, 0, R, Math.max(R * open, 0.3), 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${ring[0]}, ${ring[1]}, ${ring[2]}, 0.5)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 바깥 원을 따라 도는 반짝임
      for (const k of [0, 1]) {
        const a = time * 0.35 + k * Math.PI * 0.95 + 0.6;
        const span = 0.32;
        const g = ctx.createLinearGradient(
          Math.cos(a - span) * R, Math.sin(a - span) * R * open,
          Math.cos(a + span) * R, Math.sin(a + span) * R * open);
        g.addColorStop(0, "rgba(255,120,190,0)");
        g.addColorStop(0.5, "rgba(255,240,250,0.9)");
        g.addColorStop(1, "rgba(255,120,190,0)");
        ctx.beginPath();
        ctx.ellipse(0, 0, R, Math.max(R * open, 0.3), 0, a - span, a + span);
        ctx.strokeStyle = g;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // 장축의 빛줄기 + 가끔 스쳐 가는 별똥별 (종료 순간엔 반드시 한 번)
      if (api.shootNow) { api.shootNow = false; shotStart = t; nextShot = t + 6000; }
      else if (!reduced && t > nextShot) { shotStart = t; nextShot = t + 7000 + Math.random() * 5000; }
      const sp = (t - shotStart) / SHOT_MS;
      const env = sp >= 0 && sp <= 1 ? Math.pow(Math.sin(Math.PI * Math.min(1, sp * 1.35)), 2) * (1 - sp * 0.4) : 0;
      const s = (0.42 + 0.58 * env + 0.3 * api.collapse) * (0.1 + 0.9 * api.dim);
      const g = ctx.createLinearGradient(-R, 0, R, 0);
      g.addColorStop(0, "rgba(120,80,255,0)");
      g.addColorStop(0.3, `rgba(170,90,255,${0.5 * s})`);
      g.addColorStop(0.55, `rgba(255,170,220,${0.95 * s})`);
      g.addColorStop(0.68, `rgba(255,255,255,${Math.min(1, s)})`);
      g.addColorStop(0.85, `rgba(140,110,255,${0.6 * s})`);
      g.addColorStop(1, "rgba(90,70,255,0)");
      ctx.fillStyle = g;
      ctx.shadowColor = "rgba(200,110,255,0.9)";
      for (const [th, blur] of [[R * 0.03, 40], [R * 0.011, 18], [R * 0.0035, 6]]) {
        ctx.shadowBlur = blur;
        ctx.beginPath();
        ctx.ellipse(R * 0.1, 0, R * 0.86, th, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (env > 0 && !reduced) {
        const head = -R * 0.85 + R * 1.75 * (1 - Math.pow(1 - Math.min(1, sp), 2.2));
        const tail = R * 0.95;
        const tg = ctx.createLinearGradient(head - tail, 0, head, 0);
        tg.addColorStop(0, "rgba(140,90,255,0)");
        tg.addColorStop(0.6, `rgba(255,150,215,${0.55 * env})`);
        tg.addColorStop(1, `rgba(255,255,255,${env})`);
        ctx.fillStyle = tg;
        ctx.shadowColor = "rgba(255,190,240,1)";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.ellipse(head - tail / 2, 0, tail / 2, R * 0.016, 0, 0, Math.PI * 2);
        ctx.fill();
        const hg = ctx.createRadialGradient(head, 0, 0, head, 0, R * 0.09);
        hg.addColorStop(0, `rgba(255,255,255,${env})`);
        hg.addColorStop(0.35, `rgba(255,200,240,${0.6 * env})`);
        hg.addColorStop(1, "rgba(160,100,255,0)");
        ctx.fillStyle = hg;
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(head, 0, R * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    resize();
    addEventListener("resize", resize);
    return Object.assign(api, { frame });
  }

  const stars = createStars($("stars"));
  const orb = createOrb($("orb"));

  // ---------- 메인 루프 (타이머 + 배경) ----------
  const ease = (cur, to, k) => cur + (to - cur) * k;
  function loop(t) {
    if (running) {
      remaining = endAt - performance.now();
      if (remaining <= 0) finish();
      else render();
    }
    // 오브 상태는 목표값으로 부드럽게 따라감
    const frac = remaining / durations[phase];
    const k = reduced ? 1 : 0.06;
    orb.open = ease(orb.open, done ? 0 : 0.18 + 0.82 * frac, k);
    orb.heat = ease(orb.heat, body.dataset.state === "final" || done ? 1 : 0, k);
    orb.qna = ease(orb.qna, PHASES[phase].key === "qna" ? 1 : 0, k);
    orb.collapse = ease(orb.collapse, done ? 1 : 0, k);
    // 진행 중(일시정지 포함)엔 숫자가 잘 보이게 오브를 절반 밝기로, 대기·TIME'S UP 화면에선 원래 밝기
    const st = body.dataset.state;
    orb.dim = ease(orb.dim, st === "running" || st === "final" ? 0.45 : 1, reduced ? 1 : 0.04);
    stars.frame(reduced ? 0 : t);
    orb.frame(t);
    requestAnimationFrame(loop);
  }

  // ---------- 사운드: 0초에 "펑" 한 번 (Web Audio 합성, 외부 파일 없음) ----------
  const BOOM_VOLUME = 0.7;   // 0~1, 크기 조절은 이 값만
  let ac = null, bus = null, reverb = null, voices = [];

  function ensureAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 4; comp.ratio.value = 12;
      comp.attack.value = 0.002; comp.release.value = 0.3;
      const out = ac.createGain(); out.gain.value = BOOM_VOLUME;
      comp.connect(out); out.connect(ac.destination);
      bus = ac.createGain(); bus.connect(comp);
      const len = Math.floor(ac.sampleRate * 3);
      const ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      }
      const conv = ac.createConvolver(); conv.buffer = ir;
      reverb = ac.createGain(); reverb.gain.value = 0.35;
      reverb.connect(conv); conv.connect(comp);
    }
    if (ac.state === "suspended") ac.resume();
  }

  const track = (n) => (voices.push(n), n);
  function noise(sec, brown) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      if (brown) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      else d[i] = Math.random() * 2 - 1;
    }
    return b;
  }

  function explosion(t) {
    const crack = track(ac.createBufferSource()); crack.buffer = noise(0.08);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
    const cg = ac.createGain();
    cg.gain.setValueAtTime(0.5, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    crack.connect(hp); hp.connect(cg); cg.connect(bus); cg.connect(reverb);
    crack.start(t);

    const sub = track(ac.createOscillator()), sg = ac.createGain();
    sub.frequency.setValueAtTime(90, t);
    sub.frequency.exponentialRampToValueAtTime(28, t + 1.2);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(1.0, t + 0.008);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    sub.connect(sg); sg.connect(bus);
    sub.start(t); sub.stop(t + 1.5);

    const bd = track(ac.createBufferSource()); bd.buffer = noise(3.5);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(5000, t);
    lp.frequency.exponentialRampToValueAtTime(700, t + 0.25);
    lp.frequency.exponentialRampToValueAtTime(120, t + 3);
    const bg = ac.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(0.9, t + 0.006);
    bg.gain.exponentialRampToValueAtTime(0.25, t + 0.4);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    bd.connect(lp); lp.connect(bg); bg.connect(bus); bg.connect(reverb);
    bd.start(t); bd.stop(t + 3.5);

    const rum = track(ac.createBufferSource()); rum.buffer = noise(3.5, true);
    const rlp = ac.createBiquadFilter(); rlp.type = "lowpass"; rlp.frequency.value = 180;
    const rg = ac.createGain();
    rg.gain.setValueAtTime(0.0001, t);
    rg.gain.exponentialRampToValueAtTime(0.9, t + 0.05);
    rg.gain.exponentialRampToValueAtTime(0.0001, t + 3.3);
    rum.connect(rlp); rlp.connect(rg); rg.connect(bus);
    rum.start(t); rum.stop(t + 3.5);
  }

  function playTimesUp() {
    if (muted) return;
    ensureAudio();
    if (!ac) return;
    stopSound();
    explosion(ac.currentTime + 0.02);
  }
  function stopSound() {
    voices.forEach((n) => { try { n.stop(); } catch (e) {} });
    voices = [];
  }

  // ---------- 키보드 ----------
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const step = e.shiftKey ? 10 : 60;
    switch (e.code) {
      case "Space": case "Enter":
        e.preventDefault();
        if (!e.repeat) primary();
        break;
      case "KeyN": case "ArrowRight": goPhase(phase + 1); toast(PHASES[phase].label); break;
      case "KeyP": case "ArrowLeft": goPhase(phase - 1); toast(PHASES[phase].label); break;
      case "KeyR": goPhase(phase); toast("리셋"); break;
      case "Digit0": case "Numpad0": case "Home": goPhase(0); toast("처음으로"); break;
      case "KeyF": toggleFullscreen(); break;
      case "KeyT": jumpTo(10); break;
      case "KeyM":
        muted = !muted;
        if (muted) stopSound();
        toast(muted ? "음소거" : "소리 켜짐");
        break;
      case "ArrowUp": case "Equal": case "NumpadAdd": e.preventDefault(); adjust(step); break;
      case "ArrowDown": case "Minus": case "NumpadSubtract": e.preventDefault(); adjust(-step); break;
      default: return;
    }
    showHelpBriefly();
  });

  // 클릭/탭 = Space와 같음 (리모컨·키보드 없는 환경), 더블클릭 = 전체화면
  $("stage").addEventListener("click", primary);
  addEventListener("dblclick", toggleFullscreen);

  // ---------- 안내 & 커서 자동 숨김 ----------
  let helpTimer, cursorTimer;
  function showHelpBriefly() {
    helpEl.classList.toggle("hidden", !!document.fullscreenElement || running);
    clearTimeout(helpTimer);
    helpTimer = setTimeout(() => helpEl.classList.add("hidden"), 3000);
  }
  addEventListener("mousemove", () => {
    body.classList.remove("idle-cursor");
    helpEl.classList.remove("hidden");
    clearTimeout(cursorTimer); clearTimeout(helpTimer);
    cursorTimer = setTimeout(() => body.classList.add("idle-cursor"), 2000);
    helpTimer = setTimeout(() => helpEl.classList.add("hidden"), 3000);
  });
  document.addEventListener("fullscreenchange", showHelpBriefly);

  render();
  showHelpBriefly();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
